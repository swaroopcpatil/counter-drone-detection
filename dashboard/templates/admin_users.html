{% extends "layout.html" %}
{% block title %}Users · Skywatch{% endblock %}
{% block content %}
<div class="topbar">
  <div>
    <div class="eyebrow">Administration</div>
    <h1>Accounts</h1>
  </div>
</div>
<div class="admin-grid">
  <section class="panel">
    <div class="panel-head"><div><h2>Users</h2><p>{{ users|length }} total</p></div></div>
    <table>
      <thead><tr><th>Username</th><th>Role</th></tr></thead>
      <tbody>
        {% for u in users %}<tr><td>{{ u.username }}</td><td><span class="role {{ u.role }}">{{ u.role }}</span></td></tr>{% endfor %}
      </tbody>
    </table>
  </section>
  <section class="panel">
    <div class="panel-head"><div><h2>Create account</h2><p>admins only</p></div></div>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field"><label for="nu">Username</label><input id="nu" name="username" required minlength="3" maxlength="32"></div>
      <div class="field"><label for="np">Temporary password (12+ characters)</label><input id="np" name="password" type="password" required minlength="12" autocomplete="new-password"></div>
      <div class="field"><label for="nr">Role</label>
        <select id="nr" name="role">{% for r in roles %}<option value="{{ r }}">{{ r }}</option>{% endfor %}</select></div>
      <button class="btn" type="submit">Create</button>
    </form>
  </section>
</div>
{% endblock %}
