{% extends "base.html" %}
{% block title %}Alerts · Monitoring dashboard{% endblock %}
{% block content %}
<div class="panel">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
    <strong>Live alert feed</strong>
    <span class="muted" id="status">loading…</span>
  </div>
  <table aria-live="polite">
    <thead><tr><th>Time (s)</th><th>Track</th><th>Level</th><th>Message</th></tr></thead>
    <tbody id="rows"><tr><td colspan="4" class="muted">No alerts yet.</td></tr></tbody>
  </table>
</div>
<script>
(function () {
  const rows = document.getElementById("rows");
  const status = document.getElementById("status");

  function cell(text, cls) {
    const td = document.createElement("td");
    td.textContent = text;
    if (cls) td.className = cls;
    return td;
  }

  function render(alerts) {
    rows.textContent = "";
    if (!alerts.length) {
      const tr = document.createElement("tr");
      tr.appendChild(cell("No alerts yet.", "muted"));
      tr.firstChild.colSpan = 4;
      rows.appendChild(tr);
      return;
    }
    for (const a of alerts) {
      const tr = document.createElement("tr");
      tr.appendChild(cell(Number(a.t).toFixed(2)));
      tr.appendChild(cell("#" + a.track_id));
      tr.appendChild(cell(a.level, "level " + a.level));
      tr.appendChild(cell(a.message || ""));
      rows.appendChild(tr);
    }
  }

  async function poll() {
    try {
      const r = await fetch("/api/alerts?limit=50", { headers: { "Accept": "application/json" } });
      if (r.status === 401) { location.href = "/login"; return; }
      if (!r.ok) throw new Error("HTTP " + r.status);
      render(await r.json());
      status.textContent = "updated " + new Date().toLocaleTimeString();
    } catch (e) {
      status.textContent = "update failed: " + e.message;
    }
  }

  poll();
  setInterval(poll, 2000);
})();
</script>
{% endblock %}
